<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NekoCTI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Design direction and rules: DESIGN.md. -->

<div class="device">
  <div class="screen">

    <div class="topnav">
      <div class="wordmark">NEKOCTI</div>
      <div class="tab active" data-tab="high_ticket">HIGH TICKET <span class="count" id="count-high_ticket">-</span></div>
      <div class="tab" data-tab="watchlist">WATCHLIST <span class="count" id="count-watchlist">-</span></div>
      <div class="tab" data-tab="breaches">BREACHES <span class="count" id="count-breaches">-</span></div>
      <div class="tab" data-tab="entities">APT / ENTITIES <span class="count" id="count-entities">-</span></div>
      <div class="tab" data-tab="campaigns">CAMPAIGNS <span class="count" id="count-campaigns">-</span></div>
      <div class="tab" data-tab="archive">ARCHIVE <span class="count" id="count-archive">-</span></div>
      <div class="tab" data-tab="attack">ATT&amp;CK</div>
      <div class="tab" data-tab="pocs">POCS <span class="count" id="count-pocs">-</span></div>
    </div>

    <!-- Phone and tablet (1023px and below): this bar and a menu replace the
         tab row. The tabs above stay the source of truth; the menu drives them. -->
    <div class="mobilebar">
      <button class="mb-current" id="mb-current" type="button" aria-controls="nav-menu" aria-expanded="false">
        <span class="mb-word">NEKOCTI</span>
        <span class="mb-section" id="mb-section">HIGH TICKET</span>
        <span class="mb-count" id="mb-count"></span>
      </button>
      <button class="icon-btn" id="menu-btn" type="button" aria-label="Open sections menu" aria-controls="nav-menu" aria-expanded="false">
        <svg class="icon icon-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        <svg class="icon icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>

    <nav class="nav-menu" id="nav-menu" hidden aria-label="Sections">
      <!-- populated by app.js from the .tab elements, so labels and live
           counts can never drift from the desktop tabs -->
    </nav>

    <div class="subnav">
      <span id="subnav-ranges">
        <span class="subtab active" data-range="24h"><span class="range-prefix">LAST </span>24H</span>
        <span class="subtab" data-range="7d"><span class="range-prefix">LAST </span>7D</span>
        <span class="subtab" data-range="all">ALL TIME</span>
      </span>
      <span class="search-bar">
        <input id="search-input" placeholder="SEARCH ARCHIVE..." enterkeyhint="search">
        <span class="search-clear" id="search-clear" hidden>&times;</span>
      </span>
      <span class="subtab" id="manage-toggle" hidden>MANAGE WATCHLIST</span>
      <button class="icon-btn search-toggle" id="search-toggle" type="button" aria-label="Search the archive" aria-expanded="false">
        <svg class="icon icon-search" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3.5a7 7 0 1 0 0 14a7 7 0 1 0 0-14M15.5 15.5L21 21"/></svg>
        <svg class="icon icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>

    <div class="list" id="list">
      <div class="section-label">LOADING...</div>
    </div>

    <div class="panel" id="manage-panel" hidden>
      <!-- populated by app.js for the watchlist/entities management view -->
    </div>

    <div class="attack-view" id="attack-view" hidden>
      <!-- populated by app.js - the real MITRE ATT&CK matrix -->
    </div>

    <div class="attack-view" id="pocs-view" hidden>
      <!-- populated by app.js - real public PoC availability per CVE,
           enriched from nomi-sec/PoC-in-GitHub -->
    </div>

    <div class="reader-overlay" id="reader-overlay" hidden>
      <!-- populated by app.js - reads a full article in-dashboard instead
           of forwarding to the original site -->
    </div>

    <div class="image-lightbox" id="image-lightbox" hidden>
      <!-- populated by app.js - zoomed real (unfiltered) view of a
           reader image, for actually reading fine diagram detail -->
    </div>

    <div class="footer">
      <span class="chip" id="footer-archive">ARCHIVE -</span>
      <span class="gauge-wrap" id="footer-status-wrap"><span class="status-label">STATUS: </span><span id="footer-status">MONITORING</span><span class="footer-ago" id="footer-ago"></span><span class="gauge"><span class="gauge-fill" id="footer-gauge"></span></span></span>
      <span class="chip" id="footer-highticket">HIGH TICKET -</span>
      <span class="chip chip-action" id="run-check-btn">RUN CHECK NOW</span>
      <span class="chip chip-action" id="logout-btn">LOG OUT</span>
    </div>
    <!-- How current the data is, rather than how much of it there is: the
         archive is never pruned, so this answers "has this been re-checked
         recently?" -->
    <div class="freshness" id="freshness-line" title="When each lookup last ran"></div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
