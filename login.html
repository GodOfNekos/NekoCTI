<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NekoCTI - Log in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="device">
  <div class="screen login-screen">
    <form class="login-box" id="login-form">
      <div class="wordmark">NEKOCTI</div>
      <label class="login-label" for="login-password">PASSWORD</label>
      <input class="login-input" id="login-password" type="password" autocomplete="current-password" required autofocus>
      <button class="chip chip-action login-button" id="login-button" type="submit">LOG IN</button>
      <div class="login-status" id="login-status" role="status"></div>
    </form>
  </div>
</div>
<script src="login.js"></script>
</body>
</html>
